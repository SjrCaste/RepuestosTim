<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="poly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)" />
  <g filter="url(#shadow3)">
    <!-- Cuerpo exterior plástico técnico / polímero reforzado -->
    <ellipse cx="400" cy="290" rx="190" ry="110" fill="url(#poly)" stroke="#0f172a" stroke-width="4" />
    <!-- Borde escalonado -->
    <ellipse cx="400" cy="285" rx="165" ry="92" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <!-- Pista de rodamiento de acero -->
    <ellipse cx="400" cy="280" rx="140" ry="78" fill="url(#ring)" stroke="#475569" stroke-width="3" />
    <!-- Rodillos / Bolillas internas estilizadas -->
    <ellipse cx="400" cy="280" rx="115" ry="62" fill="none" stroke="#64748b" stroke-width="8" stroke-dasharray="14 12" />
    <!-- Agujero central para el vástago del amortiguador -->
    <ellipse cx="400" cy="280" rx="65" ry="36" fill="#0f172a" stroke="#475569" stroke-width="3" />
  </g>
  <!-- Text Label -->
  <text x="400" y="520" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#334155" letter-spacing="2">CRAPODINA DE SUSPENSIÓN TOCHTER</text>
  <text x="400" y="550" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#64748b">RODAMIENTO AXIAL SELLADO DE ALTA CARGA · GIRO SUAVE</text>
</svg>
