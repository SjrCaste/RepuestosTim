<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="rubber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <g filter="url(#shadow)">
    <!-- Splined Shaft -->
    <rect x="140" y="275" width="160" height="50" rx="4" fill="url(#metal)" stroke="#334155" stroke-width="2" />
    <line x1="160" y1="275" x2="160" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="180" y1="275" x2="180" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="200" y1="275" x2="200" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="220" y1="275" x2="220" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="240" y1="275" x2="240" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="260" y1="275" x2="260" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="280" y1="275" x2="280" y2="325" stroke="#334155" stroke-width="3" />
    <!-- Metal Band Clamp Small -->
    <rect x="290" y="270" width="15" height="60" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <!-- Rubber Boot Corrugated -->
    <path d="M 300 270 L 330 240 L 360 270 L 390 230 L 420 270 L 450 220 L 480 270 L 500 210 L 520 210 L 520 390 L 500 390 L 480 330 L 450 380 L 420 330 L 390 370 L 360 330 L 330 360 L 300 330 Z" fill="url(#rubber)" stroke="#0f172a" stroke-width="3" />
    <!-- Metal Band Clamp Large -->
    <rect x="515" y="200" width="20" height="200" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <!-- Outer Bell Housing (Junta Homocinética Campana) -->
    <path d="M 535 210 C 650 210 680 240 680 300 C 680 360 650 390 535 390 Z" fill="url(#metal)" stroke="#334155" stroke-width="3" />
    <circle cx="675" cy="300" r="12" fill="#475569" />
  </g>
  <!-- Text Label -->
  <text x="400" y="520" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#334155" letter-spacing="2">JUNTA HOMOCINÉTICA TOCHTER</text>
  <text x="400" y="550" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#64748b">CALIDAD ORIGINAL · CON FUELLE, GRASA Y ABRAZADERAS</text>
</svg>
