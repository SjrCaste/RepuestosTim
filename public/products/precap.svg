<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="metal2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)" />
  <g filter="url(#shadow2)">
    <!-- Cabezal de rótula axial / copa roscada a cremallera -->
    <path d="M 160 260 L 230 260 C 265 260 280 275 280 300 C 280 325 265 340 230 340 L 160 340 Z" fill="url(#metal2)" stroke="#1e293b" stroke-width="2.5" />
    <!-- Rosca macho cremallera -->
    <rect x="110" y="275" width="50" height="50" rx="3" fill="url(#metal2)" stroke="#1e293b" stroke-width="2" />
    <line x1="120" y1="275" x2="120" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="130" y1="275" x2="130" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="140" y1="275" x2="140" y2="325" stroke="#334155" stroke-width="3" />
    <line x1="150" y1="275" x2="150" y2="325" stroke="#334155" stroke-width="3" />
    <!-- Articulación esférica -->
    <circle cx="280" cy="300" r="26" fill="url(#metal2)" stroke="#1e293b" stroke-width="2" />
    <!-- Vástago largo del axial / precap -->
    <rect x="295" y="288" width="310" height="24" rx="2" fill="url(#metal2)" stroke="#1e293b" stroke-width="2" />
    <!-- Rosca hacia extremo de dirección -->
    <rect x="605" y="285" width="85" height="30" rx="2" fill="url(#metal2)" stroke="#1e293b" stroke-width="2" />
    <line x1="615" y1="285" x2="615" y2="315" stroke="#334155" stroke-width="2.5" />
    <line x1="625" y1="285" x2="625" y2="315" stroke="#334155" stroke-width="2.5" />
    <line x1="635" y1="285" x2="635" y2="315" stroke="#334155" stroke-width="2.5" />
    <line x1="645" y1="285" x2="645" y2="315" stroke="#334155" stroke-width="2.5" />
    <line x1="655" y1="285" x2="655" y2="315" stroke="#334155" stroke-width="2.5" />
    <line x1="665" y1="285" x2="665" y2="315" stroke="#334155" stroke-width="2.5" />
    <line x1="675" y1="285" x2="675" y2="315" stroke="#334155" stroke-width="2.5" />
  </g>
  <!-- Text Label -->
  <text x="400" y="520" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#334155" letter-spacing="2">AXIAL / PRECAP DE DIRECCIÓN TOCHTER</text>
  <text x="400" y="550" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#64748b">ACERO FORJADO TRATADO TÉRMICAMENTE · CALIDAD CERTIFICADA</text>
</svg>
